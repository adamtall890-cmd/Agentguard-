<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentGuard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>AgentGuard</h1>
        <p>Verify outcomes, not claims.</p>
    </header>

    <main>
        <!-- Restauration exacte de vos compteurs d'origine -->
        <div class="stats">
            <div>Total Checks: <span id="total-checks">0</span></div>
            <div>Verified: <span id="verified-count">0</span></div>
            <div>Fake: <span id="fake-count">0</span></div>
        </div>

        <div class="card">
            <h2>CRM Workflow</h2>
            <p>Simulate an AI Agent completing business workflows.</p>
            
            <select id="refund-id">
                <option value="refund_verified">Verified Workflow</option>
                <option value="refund_partial">Partial Completion</option>
                <option value="refund_fake">Fake Completion</option>
            </select>
            <br><br>
            <button id="btn-run">Run Workflow</button>
        </div>

        <!-- Zone d'affichage de vos alertes et JSON -->
        <div id="verdict"></div>

        <div class="result">
            <h3>Agent Execution</h3>
            <pre><code id="json-agent">Waiting...</code></pre>
        </div>

        <div class="result">
            <h3>AgentGuard Verification</h3>
            <pre><code id="json-guard">Waiting...</code></pre>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>

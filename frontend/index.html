<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgentGuard</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<header>

<h1>AgentGuard</h1>

<p class="subtitle">
Verify outcomes, not claims.
</p>

</header>

<section class="workflow">

<h2>CRM Workflow</h2>

<div class="controls">

<select id="scenario">

<option value="verified">Verified Workflow</option>

<option value="partial">Partial Completion</option>

<option value="fake">Fake Completion</option>

</select>

<button id="run">
Run Workflow
</button>

</div>

</section>

<section class="card">

<h2>Agent</h2>

<div id="agent">
Waiting...
</div>

</section>

<section class="card">

<h2>AgentGuard Verification</h2>

<div id="verification">
Waiting...
</div>

</section>

<section class="card">

<h2>Final Verdict</h2>

<div id="verdict">
Waiting...
</div>

</section>

<section class="history">

<h2>Recent Verifications</h2>

<table>

<thead>

<tr>

<th>Time</th>

<th>Lead</th>

<th>Status</th>

</tr>

</thead>

<tbody id="history">

</tbody>

</table>

</section>

</div>

<script src="/static/script.js"></script>

</body>

</html>

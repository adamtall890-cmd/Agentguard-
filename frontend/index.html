<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgentGuard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>

        <div>

            <h1>AgentGuard</h1>

            <p>
                Verify outcomes, not claims.
            </p>

        </div>

        <button class="admin">
            ADMIN
        </button>

    </header>


    <section class="cards">

        <div class="card">

            <span>Total Checks</span>

            <h2 id="total">
                0
            </h2>

        </div>

        <div class="card success">

            <span>Verified</span>

            <h2 id="verified">
                0
            </h2>

        </div>

        <div class="card danger">

            <span>Fake Completion</span>

            <h2 id="failed">
                0
            </h2>

        </div>

    </section>


    <section class="workflow">

        <h2>
            CRM Workflow
        </h2>

        <div class="controls">

            <select id="scenario">

                <option value="lead_ok">
                    Verified Workflow
                </option>

                <option value="lead_partial">
                    Partial Workflow
                </option>

                <option value="lead_missing">
                    Fake Completion
                </option>

            </select>

            <button onclick="runWorkflow()">
                Run Workflow
            </button>

        </div>

    </section>



    <section class="panel">

        <div>

            <h3>
                Agent
            </h3>

            <pre id="agent">
Waiting...
            </pre>

        </div>

        <div>

            <h3>
                AgentGuard Verification
            </h3>

            <pre id="verification">
Waiting...
            </pre>

        </div>

    </section>


    <section>

        <h2>
            Final Verdict
        </h2>

        <div id="status" class="status waiting">

            Waiting...

        </div>

    </section>


    <section>

        <h2>
            Recent Verifications
        </h2>

        <table>

            <thead>

            <tr>

                <th>Time</th>

                <th>Lead</th>

                <th>Status</th>

            </tr>

            </thead>

            <tbody id="history">

            </tbody>

        </table>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>

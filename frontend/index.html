<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentGuard — Verify outcomes, not claims.</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div>
                <h1>AgentGuard</h1>
                <div class="subtitle">Verify outcomes, not claims.</div>
            </div>
        </div>
        <div class="status-badge badge-prototype"><i class="fa-solid fa-circle"></i> Prototype</div>
    </header>

    <main>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Checks</div>
                <div class="metric-value" id="total-checks">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Verified</div>
                <div class="metric-value text-verified" id="verified-count">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Fake</div>
                <div class="metric-value text-fake" id="fake-count">0</div>
            </div>
        </div>

        <div class="workspace-section">
            <div class="section-card">
                <h2>CRM Workflow</h2>
                <p class="section-desc">Simulate an AI Agent completing business workflows.</p>
                
                <!-- Restauration de vos 3 options d'origine -->
                <div class="form-group">
                    <select id="refund-id" class="input-premium">
                        <option value="refund_verified">Verified Workflow</option>
                        <option value="refund_partial">Partial Completion</option>
                        <option value="refund_fake">Fake Completion</option>
                    </select>
                </div>
                
                <button class="btn-premium" id="btn-run">
                    <i class="fa-solid fa-play"></i> Run Workflow
                </button>
            </div>

            <div class="results-container">
                <div class="result-box">
                    <h3><i class="fa-solid fa-robot"></i> Agent Execution</h3>
                    <pre><code id="json-agent">{\n  "status": "Waiting..."\n}</code></pre>
                </div>

                <div class="result-box">
                    <h3><i class="fa-solid fa-shield-halved"></i> AgentGuard Verification</h3>
                    <pre><code id="json-guard">{\n  "status": "Waiting..."\n}</code></pre>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
